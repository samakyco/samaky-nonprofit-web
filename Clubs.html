    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>

    <a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: 18px; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px; "><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
    <div style="margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 12px;">
      <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">ES</div>
      <div style="font-size: 13px; line-height: 1.4;"><div style="font-weight: 600; color: #FAF9F5;">Eastside Senior Commons</div><div style="color: #99D293;">✓ Verified 501(c)(3)</div></div>
    </div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">
    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05;">Clubs</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #5E5B53; max-width: 640px;">Small groups that want to be part of Eastside Senior Commons. You decide who's linked.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">
      <div style="flex: 3 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
        <section>
          <h2 style="margin: 0 0 12px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px;">Waiting for you <span style="font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; background: #B97F5B; color: #1A1A1A; border-radius: 999px; padding: 3px 10px; vertical-align: middle;">{{pendingCount}}</span></h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <sc-for list="{{pending}}" as="c" hint-placeholder-count="2">
              <div style="background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 20px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px;">
                <div aria-hidden="true" style="width: 52px; height: 52px; flex: 0 0 52px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">{{c.ini}}</div>
                <div style="flex: 1 1 220px; min-width: 0;">
                  <div style="font-weight: 700; font-size: 17px;">{{c.name}}</div>
                  <div style="font-size: 14px; color: #5E5B53; margin-top: 2px;">{{c.what}}</div>
                  <div style="font-size: 13px; color: #4C6B4A; font-weight: 600; margin-top: 4px;">{{c.members}} members · {{c.led}}</div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button type="button" onClick="{{c.decline}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1A1A1A; cursor: pointer;">Not now</button>
                  <button type="button" onClick="{{c.link}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Link</button>
                </div>
              </div>
            </sc-for>
            <sc-if value="{{noPending}}" hint-placeholder-val="{{false}}">
              <div style="background: #FFFFFF; border: 1.5px dashed #E0DCCD; border-radius: 20px; padding: 20px; font-size: 15px; color: #5E5B53;">You're all caught up. New club requests show up here.</div>
            </sc-if>
          </div>
        </section>

        <section>
          <h2 style="margin: 0 0 12px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px;">Linked clubs</h2>
          <div style="background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 20px; padding: 6px 20px;">
            <sc-for list="{{linked}}" as="c" hint-placeholder-count="3">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #E5E1D3;">
                <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">{{c.ini}}</div>
                <div style="flex: 1 1 200px; min-width: 0;">
                  <div style="font-weight: 700; font-size: 16px;">{{c.name}}</div>
                  <div style="font-size: 13px; color: #5E5B53;">{{c.members}} members · {{c.what}}</div>
                </div>
                <button type="button" onClick="{{c.unlink}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #4C6B4A; cursor: pointer;">Unlink</button>
              </div>
            </sc-for>
          </div>
        </section>
      </div>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 24px;">
          <h2 style="margin: 0 0 12px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 22px;">How clubs work</h2>
          <div style="display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 1.55; color: #E5E1D3;">
            <div>Clubs are groups of students or neighbors who volunteer together and invite each other.</div>
            <div>Linking lets a club sign up for your opportunities as a group.</div>
            <div>Clubs don't verify hours. Your team does, so every hour stays trusted.</div>
            <div>You only see a club's member count, never its private chats.</div>
          </div>
        </section>
        <section style="background: #E4F1E1; border-radius: 24px; padding: 22px;">
          <div style="font-weight: 600; font-size: 15px;">Want a club of your own?</div>
          <p style="margin: 6px 0 14px; font-size: 14px; line-height: 1.55;">Invite a school club to adopt your Tuesday visits. Share one link and they can ask to join.</p>
          <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #1A1A1A; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #1A1A1A; cursor: pointer;">Copy invite link</button>
        </section>
      </aside>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: { nsc: 'pending', ukc: 'pending', ts: 'linked', tcc: 'linked', ggg: 'linked' } };
  }
  renderVals() {
    var self = this;
    var clubs = [
      { id: 'nsc', ini: 'NS', bg: '#7A4A33', fg: '#FFFFFF', name: 'Northside Story Circle', what: 'Reads aloud with residents on weekday afternoons', members: 9, led: 'Led by a verified Samakor' },
      { id: 'ukc', ini: 'KC', bg: '#E5E1D3', fg: '#1A1A1A', name: 'Shakopee High Key Club', what: 'Wants to run a monthly game night', members: 14, led: 'Led by a student officer' },
      { id: 'ts', ini: 'TS', bg: '#99D293', fg: '#1A1A1A', name: 'Tommies Serve', what: 'Univ. of St. Thomas', members: 8 },
      { id: 'tcc', ini: 'TC', bg: '#B97F5B', fg: '#1A1A1A', name: 'Thursday Chess Club', what: 'Plays chess with residents', members: 6 },
      { id: 'ggg', ini: 'GG', bg: '#4C6B4A', fg: '#FFFFFF', name: 'Gophers Give', what: 'Univ. of Minnesota', members: 21 }
    ];
    var set = function (id, v) { var s = Object.assign({}, self.state.status); s[id] = v; self.setState({ status: s }); };
    var st = this.state.status;
    var pending = clubs.filter(function (c) { return st[c.id] === 'pending'; }).map(function (c) {
      return Object.assign({}, c, { link: function () { set(c.id, 'linked'); }, decline: function () { set(c.id, 'declined'); } });
    });
    var linked = clubs.filter(function (c) { return st[c.id] === 'linked'; }).map(function (c) {
      return Object.assign({}, c, { what: c.what, unlink: function () { set(c.id, 'declined'); } });
    });
    return { pending: pending, linked: linked, pendingCount: pending.length, noPending: pending.length === 0 };
  }
}
</script>
<div aria-label="Demo with sample data" style="position:fixed;right:16px;bottom:16px;z-index:50;background:#1A1A1A;color:#FAF9F5;font:600 13px/1 Poppins,system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)">Demo · sample data</div>
