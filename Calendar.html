<!doctype html>
<html lang="en">
<head>
<script>if (window.top === window) { try { sessionStorage.setItem('samaky-start', location.pathname.split('/').pop() || 'Home.html'); } catch (e) {} location.replace('/'); }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master calendar · Samaky for Nonprofits</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
a{color:#1A1A1A}a:hover{color:#4C6B4A}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #1A1A1A; color: #FAF9F5; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="Home.html" style="display: block; padding: 0 10px 24px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 0 12px 6px;">Coordinate</div>
    <a href="Home.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect apps</a>
    <a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: 18px; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px; "><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
    <div style="margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 12px;">
      <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">ES</div>
      <div style="font-size: 13px; line-height: 1.4;"><div style="font-weight: 600; color: #FAF9F5;">Eastside Senior Commons</div><div style="color: #99D293;">✓ Verified 501(c)(3)</div></div>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 22px;">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 400px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Calendar</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 620px;">Every opportunity you create shows up here automatically. Turn on the Samaky Giving Calendar to see the dates that matter for giving and service.</p>
      </div>
      <a href="Create.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; background: #4C6B4A; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create opportunity</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">

      <section style="flex: 3 1 560px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 22px; box-sizing: border-box;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <button aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <h2 style="margin: 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 26px;">November 2026</h2>
            <button aria-label="Next month" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; color: #1A1A1A; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;" role="group" aria-label="Show on calendar">
            <button type="button" onClick="{{toggleMine}}" aria-pressed="{{mineOn}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #1A1A1A; cursor: pointer;"><span aria-hidden="true" style="{{mineBox}}">{{mineTick}}</span>My opportunities</button>
            <button type="button" onClick="{{toggleGiving}}" aria-pressed="{{givingOn}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #1A1A1A; cursor: pointer;"><span aria-hidden="true" style="{{givingBox}}">{{givingTick}}</span>Samaky Giving Calendar</button>
          </div>
        </div>

        <sc-if value="{{givingOnBool}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #F3E6DC; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px;">
            <span style="font-weight: 700;">All month:</span>Native American Heritage Month
          </div>
        </sc-if>

        <div style="overflow-x: auto;">
          <div style="min-width: 640px;">
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px;">
              <sc-for list="{{dows}}" as="d" hint-placeholder-count="7">
                <div style="font-size: 13px; font-weight: 700; color: #5E5B53; text-align: left; padding: 0 8px;">{{d}}</div>
              </sc-for>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
                <div style="{{c.cellStyle}}">
                  <div style="{{c.numStyle}}">{{c.num}}</div>
                  <sc-for list="{{c.events}}" as="e" hint-placeholder-count="1">
                    <div style="{{e.style}}">{{e.label}}</div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; font-size: 13px; color: #5E5B53;">
          <span style="display: inline-flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #99D293;"></span>Your opportunity</span>
          <span style="display: inline-flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; border: 1.5px dashed #5E5B53; box-sizing: border-box;"></span>Draft</span>
          <span style="display: inline-flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: #B97F5B;"></span>Samaky Giving Calendar</span>
        </div>
      </section>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #FFFFFF; border-radius: 24px; padding: 22px; box-sizing: border-box;">
          <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Coming up</h2>
          <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="6">
            <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid #E5E1D3;">
              <div style="{{u.dateStyle}}">
                <div style="font-size: 11px; font-weight: 700; text-transform: uppercase;">{{u.mon}}</div>
                <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.1;">{{u.day}}</div>
              </div>
              <div style="flex: 1 1 auto; min-width: 0;">
                <div style="font-weight: 700; font-size: 15px;">{{u.title}}</div>
                <div style="font-size: 13px; color: #5E5B53;">{{u.sub}}</div>
              </div>
            </div>
          </sc-for>
        </section>
        <sc-if value="{{givingOnBool}}" hint-placeholder-val="{{true}}">
          <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
            <div style="font-size: 13px; font-weight: 700; color: #B97F5B; text-transform: uppercase; letter-spacing: 0.8px;">From the Samaky Giving Calendar</div>
            <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.15;">GivingTuesday is December 1. You have nothing planned that week.</div>
            <div style="font-size: 14px; color: #CFC9BD; line-height: 1.5;">Students look for ways to give back that week. A volunteer shift is an easy way to be ready.</div>
            <a href="Create.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; background: #99D293; color: #1A1A1A; text-decoration: none; font-weight: 700; font-size: 15px; margin-top: 4px;">Plan an event that week</a>
          </section>
        </sc-if>
      </aside>

    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mine: true, giving: true };
  }
  renderVals() {
    var self = this;
    var mine = this.state.mine, giving = this.state.giving;
    var chip = 'font-size: 12px; font-weight: 700; line-height: 1.25; border-radius: 8px; padding: 4px 7px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1A1A1A; ';
    var styles = {
      mine: chip + 'background: #99D293;',
      draft: chip + 'background: #FFFFFF; border: 1.5px dashed #5E5B53;',
      giving: chip + 'background: #B97F5B;'
    };
    var evs = {
      'n7': [{ k: 'mine', label: '9:00 Tech Help' }],
      'n12': [{ k: 'mine', label: '10:00 Blood Drive' }],
      'n14': [{ k: 'mine', label: '11:00 Lunch Delivery' }],
      'n21': [{ k: 'draft', label: '9:00 Card Making' }],
      'n3': [{ k: 'giving', label: 'Election Day' }],
      'n11': [{ k: 'giving', label: 'Veterans Day' }],
      'n13': [{ k: 'giving', label: 'World Kindness Day' }],
      'n15': [{ k: 'giving', label: 'Natl. Philanthropy Day' }],
      'n26': [{ k: 'giving', label: 'Thanksgiving' }],
      'd1': [{ k: 'giving', label: 'GivingTuesday' }]
    };
    var cells = [];
    for (var i = 0; i < 35; i++) {
      var inNov = i < 30;
      var num = inNov ? i + 1 : i - 29;
      var key = (inNov ? 'n' : 'd') + num;
      var list = (evs[key] || []).filter(function (e) {
        return e.k === 'giving' ? giving : mine;
      }).map(function (e) { return { label: e.label, style: styles[e.k] }; });
      var isToday = inNov && num === 1;
      cells.push({
        num: num,
        events: list,
        cellStyle: 'min-height: 104px; box-sizing: border-box; border-radius: 12px; padding: 8px; ' + (inNov ? 'background: #F5F3EC;' : 'background: #FFFFFF; border: 1px solid #E5E1D3;'),
        numStyle: 'font-size: 14px; font-weight: 700; width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (isToday ? 'background: #4C6B4A; color: #FFFFFF;' : (inNov ? 'color: #1A1A1A;' : 'color: #6E6A62;'))
      });
    }
    var box = function (on, fill) {
      return 'width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: #1A1A1A; box-sizing: border-box; ' + (on ? 'background: ' + fill + ';' : 'border: 2px solid #8A857C;');
    };
    var all = [
      { k: 'giving', mon: 'Nov', day: 3, title: 'Election Day', sub: 'Samaky Giving Calendar' },
      { k: 'mine', mon: 'Nov', day: 7, title: 'Saturday Tech Help', sub: '18 of 20 signed up' },
      { k: 'giving', mon: 'Nov', day: 11, title: 'Veterans Day', sub: 'Samaky Giving Calendar' },
      { k: 'mine', mon: 'Nov', day: 12, title: 'Community Blood Drive', sub: '22 of 40 signed up' },
      { k: 'giving', mon: 'Nov', day: 13, title: 'World Kindness Day', sub: 'Samaky Giving Calendar' },
      { k: 'mine', mon: 'Nov', day: 14, title: 'Senior Lunch Delivery', sub: '5 of 12 signed up' }
    ];
    var upcoming = all.filter(function (u) { return u.k === 'giving' ? giving : mine; }).map(function (u) {
      return { mon: u.mon, day: u.day, title: u.title, sub: u.sub, dateStyle: 'width: 50px; flex: 0 0 50px; text-align: center; border-radius: 12px; padding: 6px 0; color: #1A1A1A; background: ' + (u.k === 'giving' ? '#B97F5B' : '#99D293') + ';' };
    });
    return {
      dows: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      cells: cells,
      upcoming: upcoming,
      mineOn: mine ? 'true' : 'false',
      givingOn: giving ? 'true' : 'false',
      givingOnBool: giving,
      mineBox: box(mine, '#99D293'),
      givingBox: box(giving, '#B97F5B'),
      mineTick: mine ? '✓' : '',
      givingTick: giving ? '✓' : '',
      toggleMine: function () { self.setState({ mine: !self.state.mine }); },
      toggleGiving: function () { self.setState({ giving: !self.state.giving }); }
    };
  }
}
</script>
<div aria-label="Demo with sample data" style="position:fixed;right:16px;bottom:16px;z-index:50;background:#1A1A1A;color:#FAF9F5;font:600 13px/1 Poppins,system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)">Demo · sample data</div>
</body>
</html>
