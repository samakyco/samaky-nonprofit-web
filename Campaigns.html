<style>

<nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #1A1A1A; color: #FAF9F5; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="Home.html" style="display: block; padding: 0 10px 18px;"><img src="brand/samaky-logo-wordmark.svg" alt="Samaky" style="display: block; width: 110px; height: auto;"></a>

      <div style="min-width: 0; line-height: 1.35;"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;"><span style="font-weight: 600; font-size: 15px; color: #FAF9F5;">Eastside Senior Commons</span></div></div>
    </a>
    <div class="navlist" style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 0 12px 6px;">Coordinate</div>
    <a href="Home.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="Verify.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect apps</a>
    <a href="Profile.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    </div>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05;">Campaigns</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #5E5B53; max-width: 620px;">Rally people around one goal for a set time. Campaigns show in the Samaky app next to your opportunities.</p>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Start a campaign</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">
      <section aria-label="Your campaigns" style="flex: 3 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{campaigns}}" as="c" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
              <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 22px;">{{c.name}}</div>
              <span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 12px; background: {{c.tagBg}};">{{c.tag}}</span>
            </div>
            <div style="font-size: 14px; color: #5E5B53; line-height: 1.55;">{{c.desc}}</div>
            <div>
              <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px;"><span style="font-weight: 600;">{{c.done}} of {{c.goal}} {{c.unit}}</span><span style="color: #5E5B53;">{{c.when}}</span></div>
              <div style="height: 10px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 10px; border-radius: 999px; background: #4C6B4A; width: {{c.pct}};"></div></div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <button type="button" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1A1A; cursor: pointer;">Edit</button>
              <button type="button" style="min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1A1A; cursor: pointer;">Copy share link</button>
              <span style="align-self: center; font-size: 13px; color: #5E5B53;">{{c.people}}</span>
            </div>
          </div>
        </sc-for>
      </section>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 22px; padding: 22px;">
          <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #4C6B4A;">From the Samaky Giving Calendar</div>
          <h2 style="margin: 6px 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 22px;">Ideas for this season</h2>
          <sc-for list="{{ideas}}" as="i" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #E5E1D3;">
              <div style="width: 50px; flex: 0 0 50px; text-align: center; background: #F3E6DC; border-radius: 12px; padding: 6px 0;"><div style="font-size: 11px; font-weight: 600; text-transform: uppercase;">{{i.mon}}</div><div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.1;">{{i.day}}</div></div>
              <div style="flex: 1 1 auto; min-width: 0;"><div style="font-weight: 600; font-size: 15px;">{{i.title}}</div><div style="font-size: 13px; color: #5E5B53; line-height: 1.45;">{{i.idea}}</div></div>
            </div>
          </sc-for>
        </section>
        <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 22px; padding: 22px; display: flex; gap: 14px; align-items: flex-start;">
          <img src="brand/maky.png" alt="" style="width: 52px; height: 52px; flex: 0 0 52px; border-radius: 999px; background: #FAF9F5; object-fit: cover;">
          <div>
            <div style="font-weight: 600; font-size: 15px;">Maky can set one up for you</div>
            <p style="margin: 6px 0 12px; font-size: 14px; line-height: 1.55; color: #E5E1D3;">Pick a date and a goal, and Maky writes the campaign page and the share message.</p>
            <a href="Maky.html" style="display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; background: #99D293; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 14px;">Ask Maky</a>
          </div>
        </section>
      </aside>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var cs = [
      { name: 'Holiday Cards for Residents', desc: 'Every resident gets a handwritten card by the holidays. Students and clubs write them on campus and drop them off.', done: 184, goal: 300, unit: 'cards', when: 'Ends Dec 18', people: '42 people joined', tag: 'Live', tagBg: '#E4F1E1' },
      { name: 'Winter Visit Weeks', desc: 'One visit a week through the coldest months, so no resident goes a week without company.', done: 38, goal: 120, unit: 'visits', when: 'Ends Feb 28', people: '17 people joined', tag: 'Live', tagBg: '#E4F1E1' },
      { name: 'GivingTuesday Supply Drive', desc: 'Large-print books, puzzles and warm socks for the activity room.', done: 0, goal: 200, unit: 'items', when: 'Dec 1', people: 'Not shared yet', tag: 'Draft', tagBg: '#E5E1D3' }
    ];
    cs.forEach(function (c) { c.pct = Math.round(c.done / c.goal * 100) + '%'; });
    return {
      campaigns: cs,
      ideas: [
        { mon: 'Nov', day: 13, title: 'World Kindness Day', idea: 'A one-day card-writing push for residents.' },
        { mon: 'Dec', day: 1, title: 'GivingTuesday', idea: 'Collect activity-room supplies, or ask for a shift pledge.' },
        { mon: 'Jan', day: 18, title: 'MLK Day of Service', idea: 'A big group visit day with student clubs.' }
      ]
    };
  }
}
</script>
</body>
</html>
