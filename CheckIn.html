<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inList: { 0: true, 1: true, 2: false, 3: true, 4: false, 5: true, 6: true } };
  }
  renderVals() {
    var self = this;
    var base = [
      { ini: 'AN', name: 'Aisha N.', note: 'Univ. of St. Thomas · First time' },
      { ini: 'EV', name: 'Elena V.', note: 'Returning · 6th shift' },
      { ini: 'MR', name: 'Marcus R.', note: 'Shakopee High · Guardian consent on file' },
      { ini: 'TS', name: 'Tommies Serve club', note: 'Group of 8 · Leader: Sophea K.' },
      { ini: 'JL', name: 'Jordan L.', note: 'Univ. of Minnesota' },
      { ini: 'DP', name: 'Dara P.', note: 'Walk-up · Added at the door' },
      { ini: 'KC', name: 'Kim C.', note: 'Community member' }
    ];
    var inList = this.state.inList;
    var here = 0;
    var people = base.map(function (b, i) {
      var on = !!inList[i];
      var count = b.name.indexOf('club') > -1 ? 8 : 1;
      if (on) here += count;
      return {
        ini: b.ini, name: b.name, note: b.note,
        pressed: on ? 'true' : 'false',
        badge: on ? 'Here' : 'Not yet',
        badgeStyle: 'border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; ' + (on ? 'background: #99D293; color: #1A1A1A;' : 'background: #FFFFFF; color: #5E5B53; border: 1.5px dashed #8A857C;'),
        toggle: function () { var n = Object.assign({}, self.state.inList); n[i] = !n[i]; self.setState({ inList: n }); }
      };
    });
    var N = 21, qr = [];
    var finder = function (r, c) {
      var spots = [[0, 0], [0, 14], [14, 0]];
      for (var s = 0; s < 3; s++) {
        var dr = r - spots[s][0], dc = c - spots[s][1];
        if (dr >= 0 && dr < 7 && dc >= 0 && dc < 7) {
          if (dr === 0 || dr === 6 || dc === 0 || dc === 6) return 1;
          if (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4) return 1;
          return 0;
        }
        if (dr >= -1 && dr <= 7 && dc >= -1 && dc <= 7) return 0;
      }
      return -1;
    };
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var f = finder(r, c);
        var on = f === -1 ? (((r * 7 + c * 13 + r * c) % 5) < 2) : f === 1;
        qr.push(on ? '#1A1A1A' : '#FFFFFF');
      }
    }
    return { people: people, here: here, total: 14, qr: qr };
  }
}
