<!doctype html>
<html lang="en">
<head>
<script>if (window.top === window) { try { sessionStorage.setItem('samaky-start', location.pathname.split('/').pop() || 'Home.html'); } catch (e) {} location.replace('/'); }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maky for coordinators · Samaky for Nonprofits</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
a{color:#1A1A1A}a:hover{color:#4C6B4A}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #1A1A1A; color: #FAF9F5; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="Home.html" style="display: block; padding: 0 10px 24px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 0 12px 6px;">Coordinate</div>
    <a href="Home.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect apps</a>
    <a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: 18px; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px; outline: 3px solid #99D293; outline-offset: 2px; "><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
    <div style="margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 12px;">
      <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">ES</div>
      <div style="font-size: 13px; line-height: 1.4;"><div style="font-weight: 600; color: #FAF9F5;">Eastside Senior Commons</div><div style="color: #99D293;">✓ Verified 501(c)(3)</div></div>
    </div>
  </nav>

  <main style="flex: 999 1 420px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 22px;">
    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Good morning, Maria</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 560px;">Maky looked through your week and picked out what needs you most.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
      <div style="background: #B97F5B; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;">Needs people</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.15;">Senior Lunch Delivery needs 7 more drivers</div>
        <div style="font-size: 14px;">Saturday, Nov 14 · 5 of 12 signed up</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #4C6B4A;">Waiting for you</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.15;">8 hours to verify from last Saturday</div>
        <div style="font-size: 14px; color: #5E5B53;">Only your team can confirm hours</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #4C6B4A;">Coming up</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.15;">GivingTuesday is Dec 1 and nothing is planned</div>
        <div style="font-size: 14px; color: #5E5B53;">From the Samaky Giving Calendar</div>
      </div>
    </div>
  </main>

  <aside aria-label="Maky assistant" style="flex: 1 1 380px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E0DCCD; display: flex; flex-direction: column; min-height: 640px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 20px 22px; border-bottom: 1px solid #E5E1D3;">
      <img src="brand/maky.png" alt="Maky" style="width: 54px; height: 54px; border-radius: 999px; background: #FAF9F5; object-fit: cover;">
      <div style="flex: 1 1 auto;">
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 20px;">Maky</div>
        <div style="font-size: 13px; color: #5E5B53;">Your coordinator helper</div>
      </div>
      <button type="button" onClick="{{reset}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #1A1A1A; cursor: pointer;">New chat</button>
    </div>

    <div style="flex: 1 1 auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;">
      <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
        <div style="{{m.wrap}}">
          <div style="{{m.bubble}}">{{m.text}}</div>
          <sc-if value="{{m.hasActions}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
              <sc-for list="{{m.actions}}" as="a" hint-placeholder-count="2">
                <a href="{{a.href}}" style="{{a.style}}">{{a.label}}</a>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="padding: 16px 22px 20px; border-top: 1px solid #E5E1D3; display: flex; flex-direction: column; gap: 12px;">
      <sc-if value="{{hasChips}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
            <button type="button" onClick="{{c.ask}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4C6B4A; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #1A1A1A; cursor: pointer;">{{c.label}}</button>
          </sc-for>
        </div>
      </sc-if>
      <div style="display: flex; gap: 8px;">
        <label for="ask" style="position: absolute; left: -9999px;">Ask Maky</label>
        <input id="ask" placeholder="Ask Maky anything about your volunteers" style="flex: 1 1 auto; min-width: 0; min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 999px; padding: 0 18px; font: inherit; font-size: 15px; color: #1A1A1A;">
        <button type="button" aria-label="Send" style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div style="font-size: 12px; color: #5E5B53; line-height: 1.4;">Maky can remind and draft. Only your team verifies hours.</div>
    </div>
  </aside>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { used: [], log: [] };
  }
  renderVals() {
    var self = this;
    var primary = 'display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #4C6B4A; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 13px;';
    var ghost = 'display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 2px solid #1A1A1A; color: #1A1A1A; text-decoration: none; font-weight: 700; font-size: 13px;';
    var bank = [
      { id: 'drivers', label: 'Find drivers for Nov 14', reply: 'I found 23 past volunteers who have driven for you before and have Saturdays open. Want me to send each one a personal invite from you? I wrote it in your voice.', actions: [{ label: 'Review invites', href: 'Home.html', style: primary }, { label: 'Edit the message', href: 'Home.html', style: ghost }] },
      { id: 'draft', label: 'Draft a GivingTuesday event', reply: 'Here is a draft from your Tech Help template: Holiday Card Making, Saturday Nov 28, 9:00 to 12:00, 25 volunteers, with Sign up and Sign in steps. It goes out as a draft until you publish it.', actions: [{ label: 'Open draft', href: 'Create.html', style: primary }, { label: 'See calendar', href: 'Calendar.html', style: ghost }] },
      { id: 'thanks', label: 'Write thank-you letters', reply: 'I drafted a letter for each of the 18 people from Saturday Tech Help. Each one names their shift and what it made possible. You can add your signature before they go out.', actions: [{ label: 'Review letters', href: 'Home.html', style: primary }] },
      { id: 'report', label: 'Make my board report', reply: 'This semester so far: 1,046 verified hours from 312 people across 41 shifts. Your best month was October. I put it on one page for your board.', actions: [{ label: 'Open report', href: 'Reports.html', style: primary }] },
      { id: 'verify', label: 'Who still needs verifying?', reply: 'Four people from last Saturday are waiting: Aisha N., Elena V., Marcus R. and Jordan L., 2 hours each. I can line them up for you, but you make the final call.', actions: [{ label: 'Go verify', href: 'CheckIn.html', style: primary }] }
    ];
    var meWrap = 'display: flex; flex-direction: column; align-items: flex-end;';
    var makyWrap = 'display: flex; flex-direction: column; align-items: flex-start;';
    var meBubble = 'max-width: 85%; background: #4C6B4A; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 11px 15px; font-size: 15px; line-height: 1.45;';
    var makyBubble = 'max-width: 90%; background: #FAF9F5; color: #1A1A1A; border-radius: 18px 18px 18px 4px; padding: 12px 15px; font-size: 15px; line-height: 1.5;';
    var msgs = [{ wrap: makyWrap, bubble: makyBubble, text: 'Morning, Maria. Two things need you today: Senior Lunch Delivery still needs 7 drivers, and 8 hours are waiting for your check. What should we start with?', hasActions: false, actions: [] }];
    this.state.log.forEach(function (id) {
      var b = bank.filter(function (x) { return x.id === id; })[0];
      msgs.push({ wrap: meWrap, bubble: meBubble, text: b.label, hasActions: false, actions: [] });
      msgs.push({ wrap: makyWrap, bubble: makyBubble, text: b.reply, hasActions: true, actions: b.actions });
    });
    var chips = bank.filter(function (b) { return self.state.used.indexOf(b.id) === -1; }).slice(0, 4).map(function (b) {
      return { label: b.label, ask: function () { self.setState({ used: self.state.used.concat([b.id]), log: self.state.log.concat([b.id]) }); } };
    });
    return {
      msgs: msgs,
      chips: chips,
      hasChips: chips.length > 0,
      reset: function () { self.setState({ used: [], log: [] }); }
    };
  }
}
</script>
<div aria-label="Demo with sample data" style="position:fixed;right:16px;bottom:16px;z-index:50;background:#1A1A1A;color:#FAF9F5;font:600 13px/1 Poppins,system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)">Demo · sample data</div>
</body>
</html>
