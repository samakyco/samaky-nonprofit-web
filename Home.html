<!doctype html>
<html lang="en">
<head>
<script>if (window.top === window) { try { sessionStorage.setItem('samaky-start', location.pathname.split('/').pop() || 'Home.html'); } catch (e) {} location.replace('/'); }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samaky dashboard home · Samaky for Nonprofits</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
@media (min-width: 820px){nav[aria-label="Main"]{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}nav[aria-label="Main"] a[href$="Maky.html"]{position:sticky;bottom:0}}
a{color:#1A1A1A}a:hover{color:#4C6B4A}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #1A1A1A; color: #FAF9F5; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="Home.html" style="display: block; padding: 0 10px 18px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="margin: 0 2px 16px; padding: 14px; border-radius: 16px; background: #2A2A2A; display: flex; align-items: center; gap: 12px;">
      <div aria-hidden="true" style="width: 48px; height: 48px; flex: 0 0 48px; border-radius: 12px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">ES</div>
      <div style="min-width: 0; line-height: 1.35;"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;"><span style="font-weight: 600; font-size: 15px; color: #FAF9F5;">Eastside Senior Commons</span></div></div>
    </div>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 0 12px 6px;">Coordinate</div>
    <a href="Home.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="Verify.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect apps</a>
    <a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 28px;">

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
      <label for="q" style="position: absolute; left: -9999px;">Search</label>
      <input id="q" type="search" placeholder="Search volunteers or opportunities" style="flex: 1 1 280px; min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 999px; padding: 0 20px; font: inherit; font-size: 15px; background: #FFFFFF; color: #1A1A1A;">
      <button aria-label="Notifications" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #1A1A1A; color: #FAF9F5; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg></button>
      <div aria-label="Maria, coordinator" style="width: 48px; height: 48px; border-radius: 999px; background: #B97F5B; display: flex; align-items: center; justify-content: center; font-weight: 700;">M</div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;">
      <div style="flex: 1 1 420px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(34px, 4vw, 48px); line-height: 1.05; letter-spacing: -1px;">Good morning, Maria</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 620px;">12 new volunteers signed up since yesterday. Three shifts this week still need people, and 8 hours are waiting for you to verify.</p>
      </div>
      <a href="Create.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; background: #4C6B4A; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create opportunity</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;">
      <div style="background: #99D293; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; box-sizing: border-box;">
        <div style="font-weight: 700; font-size: 15px;">Signed up this week</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto;">48</div>
        <div style="font-size: 14px;">+12 since yesterday</div>
      </div>
      <div style="background: #B97F5B; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; box-sizing: border-box;">
        <div style="font-weight: 700; font-size: 15px;">Open spots to fill</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto;">17</div>
        <div style="font-size: 14px;">across 3 shifts this week</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; box-sizing: border-box;">
        <div style="font-weight: 700; font-size: 15px;">Hours verified this month</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto; color: #4C6B4A;">214</div>
        <div style="font-size: 14px; color: #5E5B53;">8 hours waiting for you</div>
      </div>
      <div style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; box-sizing: border-box;">
        <div style="font-weight: 700; font-size: 15px;">Came back again</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: auto; color: #99D293;">63%</div>
        <div style="font-size: 14px;">of volunteers did a second shift</div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">

      <section style="flex: 3 1 460px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px;">
          <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Upcoming opportunities</h2>
          <a href="Create.html" style="font-weight: 700; font-size: 14px;">See all</a>
        </div>
        <sc-for list="{{opps}}" as="o" hint-placeholder-count="4">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid #E5E1D3;">
            <div style="width: 60px; flex: 0 0 60px; text-align: center; background: #FAF9F5; border-radius: 14px; padding: 8px 0;">
              <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #5E5B53;">{{o.mon}}</div>
              <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; line-height: 1.1;">{{o.day}}</div>
            </div>
            <div style="flex: 1 1 200px; min-width: 0;">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
                <span style="font-weight: 700; font-size: 16px;">{{o.title}}</span>
                <span style="font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: {{o.tagBg}};">{{o.tag}}</span>
              </div>
              <div style="font-size: 14px; color: #5E5B53; margin-top: 4px;">{{o.time}}</div>
            </div>
            <div style="flex: 0 1 180px; min-width: 140px;">
              <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px;"><span style="font-weight: 700;">{{o.filled}} / {{o.total}}</span><span style="color: #5E5B53;">signed up</span></div>
              <div style="height: 10px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 10px; border-radius: 999px; background: #4C6B4A; width: {{o.pct}};"></div></div>
            </div>
          </div>
        </sc-for>
      </section>

      <div style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box;">
          <h2 style="margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">New sign-ups</h2>
          <sc-for list="{{signups}}" as="s" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #E5E1D3;">
              <div aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">{{s.ini}}</div>
              <div style="flex: 1 1 auto; min-width: 0;">
                <div style="font-weight: 700; font-size: 15px;">{{s.name}}</div>
                <div style="font-size: 13px; color: #5E5B53;">{{s.what}}</div>
              </div>
              <div style="font-size: 13px; color: #5E5B53; white-space: nowrap;">{{s.when}}</div>
            </div>
          </sc-for>
        </section>
        <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
          <div style="font-size: 14px; color: #B9B3A8;">Only you can verify hours</div>
          <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.15;">8 hours from 4 volunteers are ready for your check</div>
          <a href="Verify.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; background: #99D293; color: #1A1A1A; text-decoration: none; font-weight: 700; font-size: 15px; margin-top: 4px;">Review and verify</a>
        </section>
      </div>

    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var opps = [
      { mon: 'Nov', day: '7', title: 'Saturday Tech Help', time: 'Sat 9:00 to 12:00 · Community Room', filled: 18, total: 20, tag: 'Almost full', tagBg: '#B97F5B' },
      { mon: 'Nov', day: '12', title: 'Community Blood Drive', time: 'Thu 10:00 to 3:00 · Fellowship Hall', filled: 22, total: 40, tag: 'Books on partner site', tagBg: '#E4F1E1' },
      { mon: 'Nov', day: '14', title: 'Senior Lunch Delivery', time: 'Sat 11:00 to 1:00 · Drivers needed', filled: 5, total: 12, tag: 'Needs people', tagBg: '#F3E6DC' },
      { mon: 'Nov', day: '21', title: 'Holiday Card Making', time: 'Sat 9:00 to 2:00 · Community Room', filled: 0, total: 30, tag: 'Draft', tagBg: '#E5E1D3' }
    ];
    opps.forEach(function (o) { o.pct = Math.round(o.filled / o.total * 100) + '%'; });
    return {
      opps: opps,
      signups: [
        { ini: 'AN', bg: '#99D293', name: 'Aisha N.', what: 'Tech Help · Univ. of St. Thomas', when: '12 min ago' },
        { ini: 'JL', bg: '#B97F5B', name: 'Jordan L.', what: 'Blood Drive · Univ. of Minnesota', when: '1 hr ago' },
        { ini: 'SK', bg: '#E4F1E1', name: 'Sophea K.', what: 'Lunch Delivery · Club: Tommies Serve', when: '3 hr ago' },
        { ini: 'MR', bg: '#E5E1D3', name: 'Marcus R.', what: 'Tech Help · Shakopee High', when: 'Yesterday' },
        { ini: 'EV', bg: '#99D293', name: 'Elena V.', what: 'Tech Help · Returning volunteer', when: 'Yesterday' }
      ]
    };
  }
}
</script>
</body>
</html>
