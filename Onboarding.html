<!doctype html>
<html lang="en">
<head>
<script>if (window.top === window) { try { sessionStorage.setItem('samaky-start', location.pathname.split('/').pop() || 'Home.html'); } catch (e) {} location.replace('/'); }</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Samaky · Samaky for Nonprofits</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
a{color:#1A1A1A}a:hover{color:#4C6B4A}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px clamp(16px, 3vw, 40px); background: #1A1A1A; color: #FAF9F5;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 180px; height: auto;">
      <span style="font-weight: 700; font-size: 15px; color: #99D293; padding-left: 14px; border-left: 1.5px solid #5E5B53;">for nonprofits</span>
    </div>
    <a href="Maky.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 0 6px; border-radius: 999px; background: #B97F5B; color: #1A1A1A; text-decoration: none; font-weight: 700; font-size: 14px;"><img src="brand/maky.png" alt="" style="width: 36px; height: 36px; border-radius: 999px; background: #FAF9F5; object-fit: cover;">Stuck? Ask Maky</a>
  </header>

  <div style="max-width: 1200px; margin: 0 auto; padding: 36px clamp(16px, 3vw, 40px) 64px; display: flex; flex-direction: column; gap: 28px;">

    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(34px, 4.4vw, 54px); line-height: 1.02; letter-spacing: -1.2px; max-width: 760px;">Your page is already waiting. Claim it in about 10 minutes.</h1>
      <p style="margin: 14px 0 0; font-size: 17px; line-height: 1.55; color: #5E5B53; max-width: 680px;">We started your profile from the IRS list of nonprofits, so most of it is filled in. You check it, add what makes you you, and you're ready to get volunteers.</p>
    </div>

    <ol aria-label="Setup steps" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <li style="{{s.style}}"><span style="{{s.dot}}">{{s.mark}}</span><span>{{s.label}}</span></li>
      </sc-for>
    </ol>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">
      <div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">

        <section style="background: #FFFFFF; border-radius: 24px; padding: 26px; box-sizing: border-box;">
          <div style="font-size: 13px; font-weight: 700; color: #4C6B4A; text-transform: uppercase; letter-spacing: 0.8px;">Step 1 · Done</div>
          <h2 style="margin: 6px 0 14px; font-family: 'Fraunces', Georgia, serif; font-size: 26px;">Find your organization</h2>
          <label for="find" style="position: absolute; left: -9999px;">Search by name or EIN</label>
          <input id="find" value="Eastside Senior Commons" style="width: 100%; min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
          <div style="margin-top: 12px; border: 2px solid #4C6B4A; border-radius: 18px; padding: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
            <div style="flex: 1 1 260px; min-width: 0;">
              <div style="font-weight: 700; font-size: 18px;">Eastside Senior Commons</div>
              <div style="font-size: 14px; color: #5E5B53; margin-top: 4px; line-height: 1.5;">EIN [00-0000000] · Minneapolis, MN<br>501(c)(3) public charity · Seniors · Founded 2001</div>
            </div>
            <span style="display: inline-flex; align-items: center; gap: 8px; background: #E4F1E1; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>This is us</span>
          </div>
          <div style="font-size: 13px; color: #5E5B53; margin-top: 10px;">From the IRS list of tax-exempt organizations, refreshed every month. Not a 501(c)(3)? Other verified nonprofits are approved too.</div>
        </section>

        <section style="background: #FFFFFF; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
          <div>
            <div style="font-size: 13px; font-weight: 700; color: #5E5B53; text-transform: uppercase; letter-spacing: 0.8px;">Step 2 · You're here</div>
            <h2 style="margin: 6px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 26px;">Add what the IRS doesn't know</h2>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center;">
            <button type="button" style="width: 96px; height: 96px; border-radius: 22px; border: 2px dashed #B9B3A8; background: #F5F3EC; font: inherit; font-size: 13px; font-weight: 700; color: #5E5B53; cursor: pointer;">Add logo</button>
            <div style="flex: 1 1 260px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
              <div style="display: flex; flex-direction: column; gap: 6px;"><label for="web" style="font-weight: 700; font-size: 14px;">Website</label><input id="web" placeholder="yourwebsite.org" style="min-height: 46px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px;"></div>
              <div style="display: flex; flex-direction: column; gap: 6px;"><label for="em" style="font-weight: 700; font-size: 14px;">Volunteer contact email</label><input id="em" placeholder="volunteer@yourorg.org" style="min-height: 46px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px;"></div>
            </div>
          </div>
          <div>
            <div style="font-weight: 700; font-size: 14px; margin-bottom: 8px;">In one sentence, why should a student show up for you?</div>
            <textarea aria-label="Why show up" rows="2" style="width: 100%; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px; line-height: 1.5; resize: vertical;">Our residents light up when students visit. One afternoon a week means more than you think.</textarea>
          </div>
          <div>
            <div style="font-weight: 700; font-size: 14px; margin-bottom: 8px;">Who can volunteer with you?</div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <span style="background: #99D293; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 14px;">Ages 15 and up</span>
              <span style="background: #99D293; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 14px;">Groups and clubs welcome</span>
              <span style="background: #99D293; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 14px;">Wheelchair accessible</span>
              <span style="background: #FFFFFF; border: 1.5px dashed #B9B3A8; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: #5E5B53;">+ Spanish speakers needed</span>
              <span style="background: #FFFFFF; border: 1.5px dashed #B9B3A8; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: #5E5B53;">+ Driver's license needed</span>
            </div>
          </div>
        </section>

        <section style="background: #FFFFFF; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
          <div>
            <div style="font-size: 13px; font-weight: 700; color: #5E5B53; text-transform: uppercase; letter-spacing: 0.8px;">Step 3</div>
            <h2 style="margin: 6px 0 4px; font-family: 'Fraunces', Georgia, serif; font-size: 26px;">Set your volunteer rules once</h2>
            <div style="font-size: 15px; color: #5E5B53;">These carry over to every opportunity, so you never type them twice.</div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px;">
            <div style="background: #F5F3EC; border-radius: 16px; padding: 16px;"><div style="font-weight: 700;">Waiver</div><div style="font-size: 14px; color: #5E5B53; margin: 4px 0 10px;">Volunteers sign it once when they first sign up.</div><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #1A1A1A; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;">Upload PDF</button></div>
            <div style="background: #F5F3EC; border-radius: 16px; padding: 16px;"><div style="font-weight: 700;">Background check</div><div style="font-size: 14px; color: #5E5B53; margin: 4px 0 10px;">Only for shifts you mark, like working with kids.</div><span style="display: inline-block; background: #E5E1D3; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px;">Off by default</span></div>
            <div style="background: #F5F3EC; border-radius: 16px; padding: 16px;"><div style="font-weight: 700;">Who verifies hours</div><div style="font-size: 14px; color: #5E5B53; margin: 4px 0 10px;">Hours only count when your team confirms them.</div><span style="display: inline-block; background: #99D293; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px;">Coordinators</span></div>
          </div>
        </section>

        <section style="background: #FFFFFF; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
          <div>
            <div style="font-size: 13px; font-weight: 700; color: #5E5B53; text-transform: uppercase; letter-spacing: 0.8px;">Step 4</div>
            <h2 style="margin: 6px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: 26px;">Invite your team</h2>
          </div>
          <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid #E5E1D3;">
              <div style="flex: 1 1 260px; min-width: 0;"><div style="font-weight: 700; font-size: 16px;">{{r.role}}</div><div style="font-size: 14px; color: #5E5B53; margin-top: 3px;">{{r.can}}</div></div>
              <input aria-label="{{r.aria}}" placeholder="name@yourorg.org" style="flex: 1 1 220px; min-height: 46px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px;">
            </div>
          </sc-for>
        </section>

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;">
          <a href="Connect.html" style="font-weight: 700; font-size: 15px;">Already use Galaxy Digital or another system? Connect it instead</a>
          <a href="Templates.html" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; border-radius: 999px; background: #4C6B4A; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px;">Save and post my first opportunity</a>
        </div>
      </div>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #99D293; border-radius: 24px; padding: 24px;">
          <h2 style="margin: 0 0 14px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">What you get</h2>
          <sc-for list="{{perks}}" as="p" hint-placeholder-count="5">
            <div style="display: flex; gap: 10px; padding: 7px 0; font-size: 15px; line-height: 1.45;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 18px; margin-top: 2px;"><path d="m5 12 5 5 9-10"/></svg><span>{{p}}</span></div>
          </sc-for>
        </section>
        <section style="background: #FFFFFF; border-radius: 24px; padding: 24px;">
          <h2 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">For executive directors</h2>
          <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #5E5B53;">You get a view-only seat. See verified hours and download grant and board reports, without being pulled into scheduling.</p>
        </section>
        <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px;">
          <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Rather have a person walk you through it?</h2>
          <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #CFC9BD;">Book 15 minutes with the Samaky team and we'll set it up together.</p>
          <button type="button" style="min-height: 48px; border-radius: 999px; border: 0; background: #B97F5B; color: #1A1A1A; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;">Book a setup call</button>
        </section>
      </aside>
    </div>
  </div>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var labels = ['Find your organization', 'Add your details', 'Set volunteer rules', 'Invite your team', 'Post first opportunity'];
    var current = 1;
    var steps = labels.map(function (l, i) {
      var done = i < current, now = i === current;
      return {
        label: l,
        mark: done ? '✓' : String(i + 1),
        style: 'display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-radius: 16px; font-size: 14px; font-weight: 700; ' + (now ? 'background: #4C6B4A; color: #FFFFFF;' : (done ? 'background: #FFFFFF; color: #1A1A1A;' : 'background: #FFFFFF; color: #5E5B53;')),
        dot: 'width: 28px; height: 28px; flex: 0 0 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: #1A1A1A; ' + (done ? 'background: #99D293;' : (now ? 'background: #B97F5B;' : 'background: #E5E1D3;'))
      };
    });
    return {
      steps: steps,
      roles: [
        { role: 'Executive Director', can: 'Sees reports and verified hours. View only.', aria: 'Executive Director email' },
        { role: 'Volunteer Coordinator', can: 'Creates opportunities, messages volunteers, verifies hours.', aria: 'Volunteer Coordinator email' },
        { role: 'Shift Leader', can: 'Checks people in on the day. Nothing else.', aria: 'Shift Leader email' }
      ],
      perks: [
        'Free to post opportunities and manage sign-ups',
        'Students from nearby high schools and universities',
        'Ready-made reports for grants and your board',
        'Your data stays yours. Download or leave anytime.',
        'A Samakian Friendly badge for your door and website'
      ]
    };
  }
}
</script>
<div aria-label="Demo with sample data" style="position:fixed;right:16px;bottom:16px;z-index:50;background:#1A1A1A;color:#FAF9F5;font:600 13px/1 Poppins,system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)">Demo · sample data</div>
</body>
</html>
