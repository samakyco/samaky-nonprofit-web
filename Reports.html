<body>

<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

    <a href="Home.html" style="display: block; padding: 0 10px 18px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 160px; height: auto;"></a>

      <div style="min-width: 0; line-height: 1.35;"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;"><span style="font-weight: 600; font-size: 15px; color: #FAF9F5;">Eastside Senior Commons</span></div></div>
    </div>
    <div class="navlist" style="display: flex; flex-direction: column; gap: 4px;">

    <a href="Home.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="Verify.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect apps</a>
    <a href="Profile.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    </div>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: auto; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px;"><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div style="flex: 1 1 380px;">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Reports</h1>
        <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 600px;">Every hour here was verified by your team. Download it for a grant, a board meeting or your own records.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;" role="group" aria-label="Time range">
        <button style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #1A1A1A; cursor: pointer;">This month</button>
        <button aria-pressed="true" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #1A1A1A; background: #1A1A1A; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; cursor: pointer;">This semester</button>
        <button style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #1A1A1A; cursor: pointer;">This year</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px;">
      <div style="background: #FFFFFF; border-radius: 24px; padding: 22px;">
        <div style="font-weight: 700; font-size: 15px;">Verified hours</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1.1; color: #4C6B4A; margin-top: 10px;">1,046</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 22px;">
        <div style="font-weight: 700; font-size: 15px;">People who showed up</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1.1; margin-top: 10px;">312</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 22px;">
        <div style="font-weight: 700; font-size: 15px;">Shifts completed</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1.1; margin-top: 10px;">41</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 22px;">
        <div style="font-weight: 700; font-size: 15px;">Showed up as planned</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1.1; margin-top: 10px;">91%</div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch;">
      <section style="flex: 3 1 440px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box;">
        <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Verified hours by month</h2>
        <div role="img" aria-label="Bar chart of verified hours: Aug 96, Sep 228, Oct 368, Nov 214 so far" style="display: flex; align-items: flex-end; gap: clamp(10px, 3vw, 36px); height: 240px; margin-top: 24px; padding: 0 8px; border-bottom: 2px solid #1A1A1A;">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="4">
            <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%;">
              <div style="font-weight: 700; font-size: 14px;">{{m.v}}</div>
              <div style="width: 100%; max-width: 72px; border-radius: 12px 12px 0 0; background: {{m.fill}}; height: {{m.h}};"></div>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: clamp(10px, 3vw, 36px); padding: 10px 8px 0;">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="4">
            <div style="flex: 1 1 0; text-align: center; font-size: 14px; color: #5E5B53;">{{m.label}}</div>
          </sc-for>
        </div>
      </section>

      <section style="flex: 2 1 300px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box;">
        <h2 style="margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Where volunteers come from</h2>
        <sc-for list="{{schools}}" as="s" hint-placeholder-count="4">
          <div style="padding: 12px 0;">
            <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 15px; margin-bottom: 6px;"><span style="font-weight: 700;">{{s.name}}</span><span style="color: #5E5B53;">{{s.n}} people</span></div>
            <div style="height: 12px; border-radius: 999px; background: #E5E1D3; overflow: hidden;"><div style="height: 12px; border-radius: 999px; background: #4C6B4A; width: {{s.pct}};"></div></div>
          </div>
        </sc-for>
      </section>
    </div>

    <section style="background: #1A1A1A; color: #FAF9F5; border-radius: 24px; padding: 24px; box-sizing: border-box;">
      <h2 style="margin: 0 0 16px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Ready-made reports</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;">
        <sc-for list="{{reports}}" as="r" hint-placeholder-count="3">
          <div style="background: #2A2A2A; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px;">
            <div style="font-weight: 700; font-size: 17px;">{{r.title}}</div>
            <div style="font-size: 14px; color: #CFC9BD; line-height: 1.45; flex: 1 1 auto;">{{r.desc}}</div>
            <button style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #99D293; color: #1A1A1A; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px;">{{r.cta}}</button>
          </div>
        </sc-for>
      </div>
    </section>

  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    var raw = [['Aug', 96], ['Sep', 228], ['Oct', 368], ['Nov so far', 214]];
    var max = 368;
    var months = raw.map(function (r, i) {
      return { label: r[0], v: r[1], h: Math.round(r[1] / max * 190) + 'px', fill: i === raw.length - 1 ? '#99D293' : '#4C6B4A' };
    });
    var sc = [['Univ. of St. Thomas', 118], ['Univ. of Minnesota', 84], ['Shakopee High', 46], ['Community members', 64]];
    var schools = sc.map(function (s) { return { name: s[0], n: s[1], pct: Math.round(s[1] / 118 * 100) + '%' }; });
    return {
      months: months,
      schools: schools,
      reports: [
        { title: 'Grant report', desc: 'Verified hours, number of people and shifts for any date range. Ready to attach to an application.', cta: 'Download PDF' },
        { title: 'Board summary', desc: 'One page with this semester at a glance, plus your top volunteers and partner schools.', cta: 'Download PDF' },
        { title: 'Volunteer list', desc: 'Every volunteer, their shifts and hours. Your data, yours to keep.', cta: 'Download CSV' }
      ]
    };
  }
}
</script>
</body>
</html>
