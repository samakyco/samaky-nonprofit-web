  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">

    <div>
      <a href="Home.html" style="font-size: 14px; font-weight: 700; text-decoration: none;">← Back to home</a>
      <h1 style="margin: 12px 0 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Create an opportunity</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 640px;">This takes about two minutes. Your name, address and cause are already filled in from your profile, so you only add what's new.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">

      <form style="flex: 3 1 460px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">

          <label for="t" style="font-weight: 700; font-size: 15px;">What's it called?</label>
          <input id="t" value="Saturday Tech Help" style="min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="d" style="font-weight: 700; font-size: 15px;">What will volunteers do?</label>
          <textarea id="d" rows="3" style="box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 12px 16px; font: inherit; font-size: 16px; line-height: 1.5; color: #1A1A1A; resize: vertical;">Help residents with phones, video calls and email. Patience matters more than tech skills.</textarea>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px;">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="dt" style="font-weight: 700; font-size: 15px;">Date</label>
            <input id="dt" value="Sat, Nov 7" style="min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="st" style="font-weight: 700; font-size: 15px;">Starts</label>
            <input id="st" value="9:00 AM" style="min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="en" style="font-weight: 700; font-size: 15px;">Ends</label>
            <input id="en" value="12:00 PM" style="min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="sp" style="font-weight: 700; font-size: 15px;">Volunteers needed</label>
            <input id="sp" value="20" style="min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="loc" style="font-weight: 700; font-size: 15px;">Where?</label>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
            <input id="loc" value="Eastside Senior Commons, 3150 Johnson St NE, Minneapolis, MN 55418" style="flex: 1 1 280px; min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A; background: #F5F3EC;">
            <span style="font-size: 13px; font-weight: 700; background: #E4F1E1; border-radius: 999px; padding: 6px 12px;">Filled from your profile</span>
          </div>
        </div>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
          <legend style="font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 4px;">Next Step: what volunteers do before the shift</legend>

          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">

            <span style="background: #FFFFFF; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700;">Seniors · 3 hours</span>
          </div>
          <div style="padding: 20px; display: flex; flex-direction: column; gap: 14px;">
            <div>
              <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1.1;">Saturday Tech Help</div>
              <div style="font-size: 14px; color: #5E5B53; margin-top: 6px;">Eastside Senior Commons · Samakian Friendly</div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px;">
              <span style="background: #FAF9F5; border-radius: 10px; padding: 8px 12px;">Sat, Nov 7 · 9:00 to 12:00</span>
              <span style="background: #F3E6DC; border-radius: 10px; padding: 8px 12px; font-weight: 700;">2 spots left</span>
            </div>
            <div>
              <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #5E5B53; margin-bottom: 10px;">Next Step</div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
                <sc-for list="{{onSteps}}" as="p" hint-placeholder-count="3">
                  <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700;"><span style="width: 26px; height: 26px; border-radius: 999px; background: #4C6B4A; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 13px;">{{p.n}}</span>{{p.label}}<span style="color: #8A857C; padding: 0 4px;">{{p.arrow}}</span></span>
                </sc-for>
              </div>
            </div>
            <div style="min-height: 50px; border-radius: 999px; background: #4C6B4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">Sign up</div>
          </div>
        </div>
        <div style="font-size: 14px; color: #5E5B53; line-height: 1.5;">You own this listing. Edit it, pause it or download your volunteer list anytime.</div>
      </aside>

    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { signup: true, orientation: true, background: false, signin: true } };
  }
  renderVals() {
    var self = this;
    var defs = [
      { id: 'signup', label: 'Sign up', locked: true },
      { id: 'orientation', label: 'Orientation' },
      { id: 'background', label: 'Background check' },
      { id: 'signin', label: 'Sign in on the day' }
    ];
    var on = this.state.on;
    var steps = defs.map(function (d) {
      var isOn = !!on[d.id];
      return {
        label: d.label,
        on: isOn ? 'true' : 'false',
        mark: isOn ? '✓' : '+',
        style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ' + (isOn ? 'background: #99D293; color: #1A1A1A; border: 2px solid #99D293;' : 'background: #FFFFFF; color: #5E5B53; border: 2px dashed #B9B3A8;'),
        pick: function () {
          if (d.locked) return;
          var next = Object.assign({}, self.state.on);
          next[d.id] = !next[d.id];
          self.setState({ on: next });
        }
      };
    });
    var active = defs.filter(function (d) { return on[d.id]; });
    var onSteps = active.map(function (d, i) {
      return { n: i + 1, label: d.label, arrow: i < active.length - 1 ? '→' : '' };
    });
    return { steps: steps, onSteps: onSteps };
  }
}
</script>
