  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 22px;">

    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Profile and team</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 640px;">How Eastside Senior Commons shows up to volunteers and schools on Samaky, and who on your team can verify hours.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">
      <section style="flex: 3 1 460px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
        <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Organization profile</h2>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
          <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 18px; background: #99D293; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px;">ES</div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="font-size: 14px; color: #5E5B53;">Your logo shows on every opportunity and letter you send</div>
            <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #1A1A1A; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;">Upload logo</button>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;">
          <div style="display: flex; flex-direction: column; gap: 6px;"><label for="p1" style="font-weight: 700; font-size: 14px;">Organization name</label><input id="p1" value="Eastside Senior Commons" style="min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A; background: #FFFFFF; width: 100%;"></div>
          <div style="display: flex; flex-direction: column; gap: 6px;"><label for="p2" style="font-weight: 700; font-size: 14px;">Main cause</label><input id="p2" value="Seniors" style="min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A; background: #FFFFFF; width: 100%;"></div>
          <div style="display: flex; flex-direction: column; gap: 6px;"><label for="p3" style="font-weight: 700; font-size: 14px;">City</label><input id="p3" value="Saint Paul, MN" style="min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A; background: #FFFFFF; width: 100%;"></div>
          <div style="display: flex; flex-direction: column; gap: 6px;"><label for="p4" style="font-weight: 700; font-size: 14px;">Website</label><input id="p4" placeholder="[YOUR WEBSITE]" style="min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A; background: #FFFFFF; width: 100%;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;"><label for="p5" style="font-weight: 700; font-size: 14px;">About us</label>
          <textarea id="p5" rows="3" style="min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A; background: #FFFFFF; width: 100%; padding: 12px 16px; min-height: 96px; resize: vertical; line-height: 1.5;">We help older adults in our neighborhood stay connected through meals, tech help and friendship.</textarea></div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <button type="button" onClick="{{save}}" style="min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;">Save changes</button>
          <sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; font-weight: 600; color: #4C6B4A;">Saved. Volunteers see the update right away.</span></sc-if>
        </div>
      </section>

      <aside style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <section style="background: #99D293; border-radius: 24px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;">Samakian Friendly</div>
          <div style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2;">✓ Verified 501(c)(3)</div>
          <div style="font-size: 14px; line-height: 1.5;">Your profile was filled in from public IRS records. Hours your team verifies count on students' transcripts.</div>
        </section>
        <section style="background: #FFFFFF; border-radius: 24px; padding: 22px; box-sizing: border-box;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px;">
            <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">Team</h2>
            <button type="button" onClick="{{invite}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Invite</button>
          </div>
          <sc-for list="{{team}}" as="t" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #E5E1D3;">
              <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">{{t.ini}}</div>
              <div style="flex: 1 1 auto; min-width: 0;"><div style="font-weight: 700; font-size: 15px;">{{t.name}}</div><div style="font-size: 13px; color: #5E5B53;">{{t.role}}</div></div>
              <span style="{{t.tagStyle}}">{{t.access}}</span>
            </div>
          </sc-for>
          <p style="margin: 10px 0 0; font-size: 13px; color: #5E5B53; line-height: 1.5;">Only people who can verify hours see the Verify hours screen.</p>
        </section>
        <a href="Onboarding.html" style="font-weight: 700; font-size: 14px;">See how a new nonprofit claims its profile</a>
      </aside>
    </div>

  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: false, invited: false }; }
  renderVals() {
    var self = this;
    var tag = 'font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; ';
    var can = tag + 'background: #E4F1E1; color: #2F5130;';
    var view = tag + 'background: #E5E1D3; color: #1A1A1A;';
    var team = [
      { ini: 'M', bg: '#B97F5B', name: 'Maria', role: 'Volunteer coordinator', access: 'Verifies hours', tagStyle: can },
      { ini: 'DK', bg: '#99D293', name: 'Devon K.', role: 'Executive director', access: 'Verifies hours', tagStyle: can },
      { ini: 'LO', bg: '#E5E1D3', name: 'Lena O.', role: 'Program assistant', access: 'View only', tagStyle: view }
    ];
    if (this.state.invited) { team.push({ ini: '+', bg: '#F3E6DC', name: 'New teammate', role: 'Invite sent by email', access: 'Pending', tagStyle: tag + 'background: #F3E6DC; color: #7A4A21;' }); }
    return {
      team: team, saved: this.state.saved,
      save: function () { self.setState({ saved: true }); },
      invite: function () { self.setState({ invited: true }); }
    };
  }
}
</script>
</body>
