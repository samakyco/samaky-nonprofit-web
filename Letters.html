<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write a letter · Samaky for Nonprofits</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAF9F5}
a{color:#1A1A1A}a:hover{color:#4C6B4A}
</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">
<nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #1A1A1A; color: #FAF9F5; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="index.html" style="display: block; padding: 0 10px 24px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 0 12px 6px;">Coordinate</div>
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect a platform</a>
    <a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: 18px; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px; "><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
    <div style="margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 12px;">
      <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">ES</div>
      <div style="font-size: 13px; line-height: 1.4;"><div style="font-weight: 600; color: #FAF9F5;">Eastside Senior Commons</div><div style="color: #99D293;">✓ Verified 501(c)(3)</div></div>
    </div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">
    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05;">Write a letter</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.6; color: #5E5B53; max-width: 640px;">Thank a volunteer with a handwritten note. It lands in their Inbox as a sealed envelope they open themselves, and they keep it.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">
      <form style="flex: 3 1 440px; min-width: 0; background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend style="font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px;">Who is it for?</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{whos}}" as="w" hint-placeholder-count="3">
              <button type="button" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="{{w.style}}">{{w.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
            <label for="note" style="font-weight: 600; font-size: 15px;">Your note</label>
            <button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 4px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1A1A; cursor: pointer;"><img src="brand/maky.png" alt="" style="width: 30px; height: 30px; border-radius: 999px; object-fit: cover;">Ask Maky to draft it</button>
          </div>
          <textarea id="note" rows="4" style="box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 16px; padding: 14px 16px; font-family: 'Fraunces', Georgia, serif; font-size: 18px; line-height: 1.55; color: #1A1A1A; resize: vertical;">Thank you for helping Mrs. Alvarez video call her grandson for the first time. She hasn't stopped talking about it.</textarea>
        </div>
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend style="font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px;">Add a sticker</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <sc-for list="{{stickers}}" as="s" hint-placeholder-count="3">
              <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" aria-label="{{s.label}}" style="{{s.style}}"><img src="{{s.src}}" alt="" style="width: 44px; height: 44px; object-fit: contain;"></button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="sig" style="font-weight: 600; font-size: 15px;">Sign it</label>
          <input id="sig" value="Maria, Volunteer Coordinator" style="min-height: 48px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 15px; color: #1A1A1A;">
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; padding-top: 6px; border-top: 1px solid #E5E1D3;">
          <button type="button" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1.5px solid #1A1A1A; background: #FFFFFF; color: #1A1A1A; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;">Save draft</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 26px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>{{sendLabel}}</button>
        </div>
      </form>

      <aside aria-label="Preview" style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <div style="font-weight: 600; font-size: 15px;">What the volunteer sees</div>
        <div style="background: #1A1A1A; color: #FAF9F5; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
          <div aria-hidden="true" style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">ES</div>
          <div style="font-size: 14px; line-height: 1.4;"><span style="font-weight: 600;">Eastside Senior Commons</span> sent you a note</div>
        </div>
        <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{toggle}}" style="position: relative; display: block; width: 100%; height: 230px; border: 1.5px solid #E0DCCD; border-radius: 18px; background: #F3EFE4; cursor: pointer; overflow: hidden; padding: 0;">
            <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(to bottom right, #ECE6D6 49.5%, transparent 50%) left / 50% 100% no-repeat, linear-gradient(to bottom left, #ECE6D6 49.5%, transparent 50%) right / 50% 100% no-repeat;"></span>
            <span aria-hidden="true" style="position: absolute; left: 50%; top: 104px; width: 40px; height: 40px; margin-left: -20px; border-radius: 999px; background: #A0482F;"></span>
            <span style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 14px; font-weight: 600; color: #1A1A1A;">Tap to open</span>
          </button>
        </sc-if>
        <sc-if value="{{opened}}" hint-placeholder-val="{{false}}">
          <div style="background: #FFFFFF; border: 1.5px solid #E0DCCD; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 13px; font-weight: 600; color: #4C6B4A;">From Eastside Senior Commons</span>
              <img src="{{stickerSrc}}" alt="" style="width: 48px; height: 48px; object-fit: contain;">
            </div>
            <p style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 21px; line-height: 1.45;">Thank you for helping Mrs. Alvarez video call her grandson for the first time. She hasn't stopped talking about it.</p>
            <div style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 17px;">Maria, Volunteer Coordinator</div>
            <button type="button" onClick="{{toggle}}" style="align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E0DCCD; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1A1A; cursor: pointer;">Close the envelope</button>
          </div>
        </sc-if>
        <div style="font-size: 14px; color: #5E5B53; line-height: 1.55;">Letters stay in the volunteer's Samaky account. Only they and your team see them.</div>
      </aside>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'shift', sticker: 'maky', open: false };
  }
  renderVals() {
    var self = this;
    var chip = function (on) {
      return 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #4C6B4A; color: #FFFFFF; border: 1.5px solid #4C6B4A;' : 'background: #FFFFFF; color: #1A1A1A; border: 1.5px solid #E0DCCD;');
    };
    var whoDefs = [
      { id: 'shift', label: 'Everyone from Saturday Tech Help (12)', send: 'Send 12 letters' },
      { id: 'one', label: 'One volunteer', send: 'Send letter' },
      { id: 'club', label: 'A club', send: 'Send to club' }
    ];
    var whos = whoDefs.map(function (d) {
      return { label: d.label, on: d.id === self.state.who ? 'true' : 'false', style: chip(d.id === self.state.who), pick: function () { self.setState({ who: d.id }); } };
    });
    var stDefs = [
      { id: 'maky', label: 'Maky sticker', src: 'brand/maky.png' },
      { id: 'mark', label: 'Samaky flower sticker', src: 'brand/samaky-mark.svg' },
      { id: 'none', label: 'Your logo', src: 'brand/samaky-mark.svg' }
    ];
    var stickers = stDefs.slice(0, 2).map(function (d) {
      var on = d.id === self.state.sticker;
      return { label: d.label, src: d.src, on: on ? 'true' : 'false', style: 'width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #FAF9F5; ' + (on ? 'border: 2.5px solid #4C6B4A;' : 'border: 1.5px solid #E0DCCD;'), pick: function () { self.setState({ sticker: d.id }); } };
    });
    var sendLabel = whoDefs.filter(function (d) { return d.id === self.state.who; })[0].send;
    return {
      whos: whos, stickers: stickers, sendLabel: sendLabel,
      stickerSrc: this.state.sticker === 'maky' ? 'brand/maky.png' : 'brand/samaky-mark.svg',
      closed: !this.state.open, opened: this.state.open,
      toggle: function () { self.setState({ open: !self.state.open }); }
    };
  }
}
</script>
<div aria-label="Demo with sample data" style="position:fixed;right:16px;bottom:16px;z-index:50;background:#1A1A1A;color:#FAF9F5;font:600 13px/1 Poppins,system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)">Demo · sample data</div>
</body>
</html>
