<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect your platform · Samaky for Nonprofits</title>
<link rel="icon" href="brand/maky.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap">

body{margin:0;background:#FAF9F5}

<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: #FAF9F5; font-family: 'Poppins', system-ui, sans-serif; color: #1A1A1A;">

  <nav aria-label="Main" style="flex: 1 1 248px; box-sizing: border-box; background: #1A1A1A; color: #FAF9F5; padding: 28px 18px; display: flex; flex-direction: column; gap: 4px;">
    <a href="index.html" style="display: block; padding: 0 10px 24px;"><img src="brand/samaky-logo-dark.svg" alt="Samaky, Catalyze Kindness" style="display: block; width: 190px; height: auto;"></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 0 12px 6px;">Coordinate</div>
    <a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home</a>
    <a href="Calendar.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg>Calendar</a>
    <a href="Templates.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3"/></svg>Day-of check-in</a>
    <a href="CheckIn.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Verify hours<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">8</span></a>
    <a href="Reports.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Engage</div>
    <a href="Letters.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Write a letter</a>
    <a href="Clubs.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clubs<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">2</span></a>
    <a href="Campaigns.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Campaigns</a>
    <a href="Challenges.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Challenges<span style="margin-left: auto; background: #B97F5B; color: #1A1A1A; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px;">1</span></a>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #B9B3A8; padding: 18px 12px 6px;">Setup</div>
    <a href="Connect.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; background: #99D293; color: #1A1A1A; font-weight: 600;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Connect apps</a>
    <a href="Onboarding.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-size: 15px; white-space: nowrap; color: #FAF9F5;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>Profile and team</a>
    <a href="Maky.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 8px; margin-top: 18px; border-radius: 14px; background: #FAF9F5; color: #1A1A1A; text-decoration: none; font-weight: 600; font-size: 15px; "><img src="brand/maky.png" alt="" style="width: 34px; height: 34px; border-radius: 999px; object-fit: cover;">Ask Maky</a>
    <div style="margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 12px;">
      <div aria-hidden="true" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 999px; background: #99D293; color: #1A1A1A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">ES</div>
      <div style="font-size: 13px; line-height: 1.4;"><div style="font-weight: 600; color: #FAF9F5;">Eastside Senior Commons</div><div style="color: #99D293;">✓ Verified 501(c)(3)</div></div>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px;">

    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -1px;">Already use a volunteer system?</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #5E5B53; max-width: 660px;">Keep using it. Connect it once, and your opportunities show up on Samaky automatically. Sign-ups go straight back to your system.</p>
    </div>

    <section aria-label="Choose your platform">
      <div style="font-weight: 700; font-size: 15px; margin-bottom: 12px;">1. Which one do you use?</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
        <sc-for list="{{platforms}}" as="p" hint-placeholder-count="4">
          <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="{{p.style}}">
            <span style="display: block; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 20px;">{{p.name}}</span>
            <span style="display: block; font-size: 14px; margin-top: 4px; font-weight: 400;">{{p.sub}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">
      <section style="flex: 3 1 440px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px;">
        <div>
          <div style="font-weight: 700; font-size: 15px;">2. Find your connection key in {{chosen}}</div>
          <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.55; color: #5E5B53;">{{hint}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="key" style="font-weight: 700; font-size: 15px;">3. Paste it here</label>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <input id="key" placeholder="Paste your key" style="flex: 1 1 260px; min-height: 50px; box-sizing: border-box; border: 1.5px solid #E0DCCD; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px; color: #1A1A1A;">
            <button type="button" style="min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: #4C6B4A; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer;">Connect</button>
          </div>
        </div>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
          <legend style="font-weight: 700; font-size: 15px; padding: 0; margin-bottom: 6px;">4. Choose what moves between you and Samaky</legend>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FAF9F5; font-size: 15px; cursor: pointer;"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #4C6B4A;">Show my opportunities on Samaky</label>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FAF9F5; font-size: 15px; cursor: pointer;"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #4C6B4A;">Send new sign-ups back to my system</label>
          <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FAF9F5; font-size: 15px; cursor: pointer;"><input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #4C6B4A;">Add hours I verify to each student's Samaky record</label>
        </fieldset>
      </section>

      <aside style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <div style="background: #99D293; border-radius: 24px; padding: 24px;">
          <h2 style="margin: 0 0 12px; font-family: 'Fraunces', Georgia, serif; font-size: 24px;">Your data stays yours</h2>
          <div style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.45;">
            <div>Your system stays the main record. Samaky just passes listings along.</div>
            <div>Disconnect anytime with one click.</div>
            <div>You decide who sees each opportunity.</div>
          </div>
        </div>
        <div style="background: #FFFFFF; border-radius: 24px; padding: 24px;">
          <h2 style="margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-size: 22px;">No system yet?</h2>
          <p style="margin: 0 0 14px; font-size: 15px; line-height: 1.5; color: #5E5B53;">Use Samaky as your volunteer system. It's built for small teams and it's free to start.</p>
          <a href="Create.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 2px solid #1A1A1A; text-decoration: none; font-weight: 700; font-size: 15px;">Create your first opportunity</a>
        </div>
      </aside>
    </div>

  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'galaxy' };
  }
  renderVals() {
    var self = this;
    var defs = [
      { id: 'galaxy', name: 'Galaxy Digital', sub: 'Get Connected' },
      { id: 'hub', name: 'VolunteerHub', sub: 'Events and sign-ups' },
      { id: 'better', name: 'Better Impact', sub: 'Volunteer database' },
      { id: 'other', name: 'Something else', sub: 'Tell us, or upload a file' }
    ];
    var picked = this.state.picked;
    var platforms = defs.map(function (d) {
      var on = d.id === picked;
      return {
        name: d.name, sub: d.sub, on: on ? 'true' : 'false',
        style: 'text-align: left; min-height: 96px; padding: 18px; border-radius: 20px; font: inherit; color: #1A1A1A; cursor: pointer; ' + (on ? 'background: #B97F5B; border: 2px solid #1A1A1A;' : 'background: #FFFFFF; border: 2px solid #E0DCCD;'),
        pick: function () { self.setState({ picked: d.id }); }
      };
    });
    var chosenDef = defs.filter(function (d) { return d.id === picked; })[0];
    var hint = picked === 'other'
      ? 'Tell us which system you use and we will check if it can connect. Until then, you can upload a spreadsheet of your opportunities and we will keep it in sync.'
      : 'Sign in to ' + chosenDef.name + ' as an admin. In your settings, look for a section called API or Integrations and copy the key. If you cannot find it, your ' + chosenDef.name + ' account manager can turn it on for you.';
    return { platforms: platforms, chosen: picked === 'other' ? 'your system' : chosenDef.name, hint: hint };
  }
}
</script>
<div aria-label="Demo with sample data" style="position:fixed;right:16px;bottom:16px;z-index:50;background:#1A1A1A;color:#FAF9F5;font:600 13px/1 Poppins,system-ui,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18)">Demo · sample data</div>
</body>
</html>
